[project]
name = "yomimimi-api"
version = "1.0.0"
description = "Convert public Japanese articles to private, short-lived audio."
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.116.1",
  "uvicorn[standard]==0.35.0",
  "pydantic-settings==2.10.1",
  "httpx==0.28.1",
  "trafilatura==2.0.0",
  "lxml-html-clean==0.4.3",
  "google-cloud-texttospeech==2.27.0",
  "python-ulid==3.1.0",
  "filelock==3.19.1"
]

[project.optional-dependencies]
test = ["pytest==8.4.1", "pytest-asyncio==1.1.0"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.setuptools]
packages = ["app"]
